name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AionApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      - name: Remove BOM from Java files
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/java")
          for path in root.rglob("*.java"):
              data = path.read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  path.write_bytes(data[3:])
                  print(f"Removed BOM: {path}")
          PY

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aion-debug-apk
          path: AionApp/app/build/outputs/apk/debug/app-debug.apk
